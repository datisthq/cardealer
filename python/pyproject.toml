[project]
name = "cardealer"
version = "0.4.0"
description = "Fairspec cardealer extension"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pydantic>=2.12", "typing-extensions>=4.15"]
slug = "cardealer"
title = "Fairspec Cardealer"

[[project.authors]]
name = "Evgeny Karev"

[project.urls]
homepage = "https://datisthq.github.io/cardealer"
repository = "https://github.com/datisthq/cardealer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

