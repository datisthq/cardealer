[project]
name = "cardealer"
version = "0.4.0"
description = "Fairspec cardealer extension"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["fairspec-metadata>=0.3.0", "pydantic>=2.12", "typing-extensions>=4.15"]
slug = "cardealer"
title = "Fairspec Cardealer"

[[project.authors]]
name = "Evgeny Karev"

[project.urls]
homepage = "https://datisthq.github.io/cardealer"
repository = "https://github.com/datisthq/cardealer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.15", "ty>=0.0.15"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
python_files = ["*_unit.py"]
filterwarnings = ["error::UserWarning"]

[tool.hatch.build.targets.wheel]
packages = ["cardealer"]

# Subclasses narrow fairspec base fields to literals, which is the twin's purpose
[[tool.ty.overrides]]
include = ["cardealer/models/resource.py", "cardealer/models/dataset.py"]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"
invalid-attribute-override = "ignore"
