name: release

on:
  push:
    branches:
      - main

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  release:
    needs: [test]
    runs-on: ubuntu-latest

    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Release Project
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          config-file: .release/config.json
          manifest-file: .release/manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assign Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number' |
            xargs -r -I{} gh api "repos/$GITHUB_REPOSITORY/issues/{}/assignees" -f "assignees[]=roll"

      - name: Find Release Branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please"))][0].headRefName')
          echo "name=${name:-}" >> "$GITHUB_OUTPUT"

      - name: Checkout Release Branch
        if: steps.branch.outputs.name != ''
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ steps.branch.outputs.name }}
      - name: Setup Uv
        if: steps.branch.outputs.name != ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Setup Pnpm
        if: steps.branch.outputs.name != ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        if: steps.branch.outputs.name != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        if: steps.branch.outputs.name != ''
        run: pnpm install
      - name: Publish Profiles
        if: steps.branch.outputs.name != ''
        run: pnpm publish:profiles
      - name: Commit Profiles
        if: steps.branch.outputs.name != ''
        env:
          LEFTHOOK: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .livemark/public
          git diff --cached --quiet || git commit -m "chore: publish the versioned profiles"
          git push

  crates:
    needs: [release]
    if: needs.release.outputs.created == 'true'
    environment: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Authenticate Crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish Packages
        working-directory: rust
        run: cargo publish -p cardealer
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  python:
    needs: [release]
    if: needs.release.outputs.created == 'true'
    environment: release
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install && pnpm -C python setup
      - name: Build Packages
        run: pnpm -C python build
      - name: Publish Packages
        run: pnpm -C python release

  typescript:
    needs: [release]
    if: needs.release.outputs.created == 'true'
    environment: release
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Build Packages
        run: pnpm -C typescript build
      - name: Publish Packages
        run: pnpm -C typescript release

  deploy:
    needs: [release]
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      id-token: write
      pages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Setup Pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: package.json
      - name: Install Dependencies
        run: pnpm install
      - name: Build Website
        run: pnpm docs:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .livemark/build/client
      - name: Deploy Site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
